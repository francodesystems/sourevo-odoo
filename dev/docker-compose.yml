# Odoo of this branch, to try the module (dev/odoo.sh). On 20.0: odoo:18.0.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: odoo, POSTGRES_PASSWORD: odoo, POSTGRES_DB: postgres }
    volumes: [db:/var/lib/postgresql/data]
  odoo:
    image: odoo:18.0
    depends_on: [db]
    ports: ["8179:8069"]
    command: ["--http-interface=0.0.0.0"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # a Sourevo running on this machine
    environment: { HOST: db, USER: odoo, PASSWORD: odoo }
    volumes: [data:/var/lib/odoo, ..:/mnt/extra-addons]
volumes: { db: {}, data: {} }
